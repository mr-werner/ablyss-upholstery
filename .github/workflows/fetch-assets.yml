name: fetch-assets
on: push
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          mkdir -p extra
          while read slug url; do
            [ -z "$url" ] && continue
            h=$(echo -n "$url" | md5sum | cut -c1-10)
            name=$(basename "${url%%/:/*}" | sed 's/[?#].*//; s/%20/-/g; s/[^A-Za-z0-9._-]/_/g' | cut -c1-80)
            mkdir -p "extra/$slug"
            curl -sSL -A "$UA" --max-time 40 --max-filesize 4000000 -o "extra/$slug/$h-$name" "$url" && echo "$h-$name $url" >> "extra/$slug/index.txt" || rm -f "extra/$slug/$h-$name"
          done < urls.txt
          du -sh extra/*
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add extra && git commit -qm "Fetched extra images" && git push
