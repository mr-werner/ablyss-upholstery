name: fetch-assets
on: push
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p orig2 && cd orig2
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          get() { curl -sSL -A "$UA" -e "https://ablyss.com/" "https://ablyss.com/$1" -o "$2" || true; }
          for cp in 1:11 1:54 1:59 1:60 1:61 1:63 1:64 1:68 1:69 1:70 12:56 12:58 12:62 12:71 13:65 13:66 2:67; do c=${cp%%:*}; p=${cp##*:}; get "upholstry-gallery-denver-colorado.php?c=$c&p=$p" "d-$p.html"; done
          cat d-*.html | grep -hoiE "src=['\"][^'\"]+\.(png|jpe?g|gif|webp)['\"]" | sed -E "s/^src=['\"]//; s/['\"]$//" | grep -v '^http' | sort -u > urls.txt
          cat urls.txt
          while read u; do mkdir -p "files/$(dirname "$u")"; get "$u" "files/$u"; done < urls.txt
          file $(find files -type f) > types.txt
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add orig2 && git commit -m "Fetched original site assets (3)" && git push
